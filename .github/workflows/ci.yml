name: CI

on:
  push:
    branches:
    - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: common/tests/package-lock.json

      - name: Install dependencies
        working-directory: common/tests
        run: npm ci

      - name: Run tests
        working-directory: common/tests
        run: npm test

  syntax:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check site scripts
        run: node scripts/check-syntax.mjs
